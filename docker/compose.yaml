
services:
  postgres:
    image: postgres:16
    container_name: mit03_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: labuser
      POSTGRES_PASSWORD: lab_postgres_pw
      POSTGRES_DB: ecommerce
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - lab_net
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labuser -d ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7.0
    container_name: mit03_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: labadmin
      MONGO_INITDB_ROOT_PASSWORD: lab_mongo_pw
    volumes:
      - mongo_data:/data/db
    networks:
      - lab_net
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --username
        - labadmin
        - --password
        - lab_mongo_pw
        - --authenticationDatabase
        - admin
        - --eval
        - "db.adminCommand({ping:1}).ok"
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7.2
    container_name: mit03_redis
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - lab_net
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
  mongo_data:
  redis_data:

networks:
  lab_net:
    external: true
